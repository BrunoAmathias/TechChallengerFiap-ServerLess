name: CI - Validação de PR

on:
  pull_request:
    branches:
      - main
      - Homolog
      - Dev

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependências
        run: npm install

      - name: Validar que o handler carrega sem erros de sintaxe
        run: node -e "require('./index.js'); console.log('index.js OK')"
